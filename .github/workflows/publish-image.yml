name: unit test, SAST, and publishing image
on: [push, workflow_dispatch]

env:
    IMAGE_NAME: "smikesword/go-shopping-service"
    VERSION: ${{ github.sha }}
    REGISTRY: "ghcr.io"

jobs:
    test:
        name: runs tests and SAST scan with Trivy
        runs-on: ubuntu-latest
        permissions:
            security-events: write
        
        steps:
            - uses: actions/checkout@v4
            - name: SAST with Trivy
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs'
                format: 'sarif'
                output: 'trivy-results.sarif'
                severity: 'CRITICAL,HIGH'
            - name: upload Trivy scan results to GitHub security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v4
              with:
                sarif_file: 'trivy-results.sarif'
            - name: download go in runner
              uses: actions/setup-go@v7
              with:
                go-version: '1.26.0'
                cache: true
            - run: go test -v .
    build:
        name: build image, run to test, and publish
        runs-on: ubuntu-latest
        needs: [test]
        permissions:
            security-events: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: setup docker buildx
              uses: docker/setup-buildx-action@v4
            - name: just build docker image not push
              uses: docker/build-push-action@v7
              with:
                context: .
                push: false
                tags: ${{ env.IMAGE_NAME }}/${{ env.VERSION }}
                load: true
            - name: check image name
              run: |
                docker image ls
            - name: do image scan with anchore
              uses: anchore/scan-action@v7
              with:
                image: "${{ env.IMAGE_NAME }}/${{ env.VERSION }}"
                fail-build: false
                output-format: 'sarif'
                output-file: 'anchore-results.sarif'
            - name: upload Anchore scan results to GitHub security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v4
              with:
                sarif_file: 'anchore-results.sarif'
            - name: login to container registry
              uses: docker/login-action@v4
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: push to github registry
              id: build-and-push
              uses: docker/build-push-action@v7
              with:
                context: .
                sbom: true
                provenance: mode=max
                push: true
                tags: ${{ env.IMAGE_NAME }}/${{ env.VERSION }}
            - name: install cosign
              uses: sigstore/cosign-installer@v4.1.2
            - name: sign image with cosign
              run: |
               cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }} 
